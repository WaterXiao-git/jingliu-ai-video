<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>镜流 · AI 短剧工作台</title>
  <style>
    body { margin:0; background:#10121a; color:#edf0f8; font:16px/1.75 Inter,"Microsoft YaHei",sans-serif; }
    main { max-width:740px; margin:0 auto; padding:clamp(38px,9vw,105px) 24px; }
    h1 { line-height:1.12; font-size:clamp(35px,7vw,65px); margin:0 0 22px; }
    a { color:#c6b6ff; }
    .buttons { display:flex; flex-wrap:wrap; gap:12px; margin:24px 0 40px; }
    .buttons a { background:#231d37; border:1px solid #493d66; padding:8px 13px; border-radius:8px; text-decoration:none; }
    .buttons a:first-child { color:#181022; background:#beaaff; font-weight:650; }
    p,li { color:#b8bdd0; }
    section { border-top:1px solid #323645; margin-top:32px; padding-top:12px; }
  </style>
</head>
<body>
  <main>
    <h1>镜流</h1>
    <p>在自己的电脑上制作 AI 短剧。导入参考图，生成镜头，配字幕并导出 MP4。</p>
    <div class="buttons">
      <a href="https://gitee.com/xiao-ming-jun/jingliu-ai-video">下载工作台</a>
      <a href="https://gitee.com/xiao-ming-jun/jingliu-ai-video/issues">作品社区</a>
      <a href="https://gitee.com/xiao-ming-jun/jingliu-ai-video/blob/main/docs/installation.md">安装与排错</a>
    </div>
    <section>
      <h2>在 Windows 上开始</h2>
      <ol>
        <li>下载并解压工作台，双击「打开镜流.cmd」。</li>
        <li>查看本机检测结果和安装计划，再选择是否继续。</li>
        <li>进入工作台，按新手引导完成第一镜。</li>
      </ol>
    </section>
    <section>
      <h2>分享作品</h2>
      <p>可在工作台预览并导出缩略图和分享卡。你可以将有权公开的作品链接发到社区。</p>
      <p><a href="https://gitee.com/xiao-ming-jun/jingliu-ai-video/blob/main/docs/community.md">查看分享规则和投稿格式</a></p>
    </section>
  </main>
</body>
</html>
