name: Deployment checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B deploy/doctor.py --json
      - run: node --check studio/web/app.js
      - run: node --check studio/web/onboarding.js
      - run: node --check studio/web/waiting.js
      - name: Parse Windows launcher and offline speech script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @('deploy/setup.ps1', 'deploy/launch.ps1', 'deploy/shortcut.ps1', 'studio/local_speech.ps1')) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$issues) | Out-Null
            if ($issues) { throw ($issues | Out-String) }
          }
      - name: Build and inspect Windows EXE
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -B desktop/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\desktop\check_icon.ps1 -Executable .\dist\Jingliu.exe
          $process = Start-Process -FilePath (Join-Path $PWD 'dist/Jingliu.exe') -ArgumentList "--self-test `"$PWD\dist\self-test.json`" --app-root `"$PWD\build\exe-smoke`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'EXE self-test failed' }
          $result = Get-Content 'dist/self-test.json' -Raw | ConvertFrom-Json
          if (!$result.zip_traversal_rejected -or !$result.required_files_present) { throw 'EXE payload checks failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Jingliu-Windows-x64
          path: |
            dist/Jingliu.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/self-test.json
            dist/Jingliu-Windows-x64-*.zip
